train: "efa/sn2/train"
valid: "efa/sn2/valid"
chunk_size: 1
num_graphs: 32
num_nodes: 192
num_edges: 768
loss_weights: {"energy": 0.5, "forces": 0.5}
scale_by_variance: False
correct_mean: True
optimizer: "adam"
start_learning_rate: 1e-4
min_learning_rate: 1e-6
max_epochs: 500
valid_every_epoch: 2
decay_style: "linear"
start_decay_after: 10
default_matmul_precision: "float32"
seed: 23
# modify for testing
benchmark_pipeline: False
use_wandb: True
worker_count: 4
worker_buffer_size: 2