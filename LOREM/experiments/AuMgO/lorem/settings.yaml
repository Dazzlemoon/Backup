train: "AuMgO_train"
valid: "AuMgO_valid"
chunk_size: 32
num_graphs: 2
num_nodes: 128
num_edges: 8192
loss_weights: {"energy": 1000.0, "forces": 1.0}
scale_by_variance: False
start_learning_rate: 4e-4
min_learning_rate: 1e-6
max_epochs: 4000
optimizer: "adam"
default_matmul_precision: "float32"
correct_mean: True
valid_every_epoch: 2
decay_style: "linear"
